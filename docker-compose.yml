services:
  signal:
    build: .
    ports:
      - "8080:8080"
    environment:
      SIGNAL_CONFIG: /config/signal.config.json
      # Set to 1 when SIGNAL is served over HTTPS (behind a reverse proxy):
      SIGNAL_SECURE_COOKIES: "0"
      # Secrets referenced in checks as ${ENV:NAME}, e.g.:
      # CRM_READ_TOKEN: ${CRM_READ_TOKEN}
    volumes:
      - signal-data:/data
      - ./signal.config.json:/config/signal.config.json:ro
    restart: unless-stopped
volumes:
  signal-data:
