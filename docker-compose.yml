services:
  verax:
    build: .
    ports:
      - "8080:8080"
    environment:
      VERAX_CONFIG: /config/verax.config.json
      # Set to 1 when VERAX MERIDIAN is served over HTTPS (behind a reverse proxy):
      VERAX_SECURE_COOKIES: "0"
      # Secrets referenced in checks as ${ENV:NAME}, e.g.:
      # CRM_READ_TOKEN: ${CRM_READ_TOKEN}
    volumes:
      - verax-data:/data
      - ./verax.config.json:/config/verax.config.json:ro
    restart: unless-stopped
volumes:
  verax-data:
